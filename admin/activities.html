<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>活动配置 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.ac-wrap { padding: 14px 14px 90px; }
.ac-card { background: #fff; border: 1px solid #eaeaea; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.ac-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f5f5f5; }
.ac-logo { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: #f5f5f5; }
.ac-logo img { width: 100%; height: 100%; object-fit: cover; }
.ac-title { flex: 1; }
.ac-title .n { font-size: 16px; font-weight: 600; color: #000; }
.ac-title .s { font-size: 12px; color: #888; margin-top: 2px; }
.ac-switch { position: relative; width: 46px; height: 26px; background: #ddd; border-radius: 13px; cursor: pointer; flex-shrink: 0; transition: background .2s; }
.ac-switch.on { background: #1a73e8; }
.ac-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: left .2s; }
.ac-switch.on::after { left: 23px; }
.ac-row { margin-bottom: 14px; }
.ac-row label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
.ac-row input { width: 100%; padding: 10px 12px; border: 1px solid #eaeaea; border-radius: 8px; font-size: 14px; outline: none; }
.ac-row input:focus { border-color: #1a73e8; }
.ac-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ac-inline { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
.ac-inline .lab { font-size: 13px; color: #333; }
.ac-inline:last-child { border-bottom: none; }
.ac-save { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; margin-top: 10px; }
.ac-save:active { opacity: .8; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="ac-wrap"><div id="acList"></div></div>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<script src="app.js"></script>
<script src="activities.js"></script>
</body>
</html>
