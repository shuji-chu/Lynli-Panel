<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理员 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.adm-wrap { padding: 14px 14px 90px; }
.adm-count { font-size: 13px; color: #666; margin-bottom: 12px; }
.adm-count b { color: #000; }
.adm-card { background: #fff; border: 1px solid #eaeaea; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.adm-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.adm-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg,#e94a8a,#a64be9); color: #fff; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; }
.adm-info { flex: 1; min-width: 0; }
.adm-mail { font-size: 15px; font-weight: 600; color: #000; word-break: break-all; }
.adm-id { font-size: 11px; color: #bbb; margin-top: 2px; }
.adm-del { padding: 7px 14px; background: #fff; border: 1px solid #ffd5d5; color: #e74c3c; border-radius: 8px; font-size: 12px; }
.adm-del:active { background: #fff5f5; }
.adm-foot { font-size: 11px; color: #bbb; border-top: 1px solid #f5f5f5; padding-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="adm-wrap">
    <div class="adm-count" id="count">共 <b>0</b> 位管理员</div>
    <div id="admList"></div>
  </div>
  <button class="fab" onclick="editAdmin(null)">＋</button>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<div id="modal"></div>
<script src="app.js"></script>
<script src="admins.js"></script>
</body>
</html>
