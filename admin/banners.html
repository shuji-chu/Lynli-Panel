<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>广告位 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.bn-wrap { padding: 14px 14px 90px; }
.bn-count { font-size: 13px; color: #666; margin-bottom: 12px; }
.bn-count b { color: #000; }
.bn-card { background: #fff; border: 1px solid #eaeaea; border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.bn-media { position: relative; width: 100%; aspect-ratio: 3/1; background: #f5f5f5; overflow: hidden; }
.bn-media img, .bn-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
.bn-media .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 12px; }
.bn-type-tag { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 6px; backdrop-filter: blur(4px); }
.bn-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 12px 10px; background: linear-gradient(transparent, rgba(0,0,0,.7)); color: #fff; }
.bn-caption .t { font-size: 14px; font-weight: 600; }
.bn-caption .s { font-size: 11px; opacity: .85; margin-top: 2px; }
.bn-body { padding: 14px; }
.bn-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.bn-status { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }
.bn-status.on { background: #e8f8ef; color: #0a9f52; }
.bn-status.off { background: #f2f2f2; color: #888; }
.bn-sort { font-size: 12px; color: #888; }
.bn-link { font-size: 12px; color: #1a73e8; word-break: break-all; margin-bottom: 12px; }
.bn-link.none { color: #bbb; }
.bn-actions { display: flex; gap: 10px; border-top: 1px solid #f5f5f5; padding-top: 12px; }
.bn-actions button { flex: 1; padding: 9px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; }
.bn-actions .edit { background: #f2f2f2; color: #333; }
.bn-actions .del { background: #fff; color: #e74c3c; border: 1px solid #ffd5d5; }
.bn-actions .up { background: #f2f2f2; color: #333; }
.bn-actions .down { background: #f2f2f2; color: #333; }
.type-switch { display: flex; gap: 8px; margin-bottom: 16px; }
.type-switch .ts { flex: 1; text-align: center; padding: 11px; border: 1px solid #eaeaea; border-radius: 10px; font-size: 14px; color: #666; cursor: pointer; }
.type-switch .ts.on { background: #000; color: #fff; border-color: #000; font-weight: 500; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="bn-wrap">
    <div class="bn-count" id="count">共 <b>0</b> 张广告</div>
    <div id="bnList"></div>
  </div>
  <button class="fab" onclick="editBanner(null)">＋</button>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<div id="modal"></div>
<script src="app.js"></script>
<script src="banners.js"></script>
</body>
</html>
