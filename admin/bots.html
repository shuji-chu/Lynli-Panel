<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机器人渠道 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.bt-wrap { padding: 14px 14px 90px; }
.bt-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.bt-sum-card { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 14px 12px; text-align: center; }
.bt-sum-card .k { font-size: 11px; color: #888; margin-bottom: 6px; }
.bt-sum-card .v { font-size: 20px; font-weight: 700; color: #000; }
.bt-sum-card .v.g { color: #0a9f52; }
.bt-card { background: #fff; border: 1px solid #eaeaea; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.bt-card.off { opacity: .55; }
.bt-row1 { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.bt-logo { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: #f5f5f5; }
.bt-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bt-logo.safew { background: linear-gradient(135deg, #2b6cff, #4dd0e1); }
.bt-logo.mivra { background: linear-gradient(135deg, #a64be9, #e94a8a); }
.bt-logo.telegram { background: linear-gradient(135deg, #229ED9, #6ec6f0); }
.bt-info { flex: 1; min-width: 0; }
.bt-name { font-size: 16px; font-weight: 600; color: #000; }
.bt-handle { font-size: 12px; color: #999; margin-top: 2px; font-family: ui-monospace, Menlo, monospace; }
.bt-status { font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 500; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.bt-status.on { background: #e8f8ef; color: #0a9f52; }
.bt-status.off { background: #ffeaea; color: #e74c3c; }
.bt-status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.bt-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding-top: 12px; border-top: 1px solid #f5f5f5; }
.bt-stats .it { display: flex; flex-direction: column; gap: 3px; }
.bt-stats .k { font-size: 11px; color: #aaa; }
.bt-stats .v { font-size: 14px; font-weight: 600; color: #333; }
.bt-actions { display: flex; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f5f5f5; }
.bt-actions button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; }
.bt-actions .open { background: #f2f2f2; color: #333; }
.bt-actions .toggle { background: #f2f2f2; color: #333; }
.bt-actions .toggle.off { background: #fff4e8; color: #d97706; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="bt-wrap">
    <div class="bt-summary" id="summary"></div>
    <div id="botList"></div>
  </div>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<script src="app.js"></script>
<script src="bots.js"></script>
</body>
</html>
