<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客服</title><link rel="stylesheet" href="style.css"><style>
.chat-wrap { padding: 12px; }
.chat-list { display: flex; flex-direction: column; gap: 10px; }
.chat-item { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.chat-item:active { background: #fafafa; }
.ci-l { flex: 1; min-width: 0; }
.ci-email { font-size: 14px; font-weight: 600; color: #000; margin-bottom: 4px; }
.ci-preview { font-size: 12px; color: #888; }
.ci-tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
.ci-tag.ai { background: #e8f4ff; color: #1a73e8; }
.ci-tag.human { background: #fff4e8; color: #d97706; }

.chat-detail { display: flex; flex-direction: column; height: calc(100vh - 60px - 62px); }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border-bottom: 1px solid #eaeaea; }
.back-btn { background: none; border: none; font-size: 14px; color: #1a73e8; padding: 4px 8px; cursor: pointer; }
.chat-title { font-size: 14px; font-weight: 600; flex: 1; }
.chat-state { font-size: 11px; padding: 3px 8px; border-radius: 6px; }
.chat-state.ai { background: #e8f4ff; color: #1a73e8; }
.chat-state.human { background: #fff4e8; color: #d97706; }
.chat-toolbar { display: flex; gap: 8px; padding: 8px 14px; background: #fff; border-bottom: 1px solid #eaeaea; }
.tb-btn { flex: 1; padding: 8px; border: 1px solid #eaeaea; border-radius: 8px; background: #fff; font-size: 12px; color: #333; cursor: pointer; }
.tb-btn.take { background: #fff4e8; color: #d97706; border-color: #ffe0b3; font-weight: 600; }
.tb-btn.back-ai { background: #e8f4ff; color: #1a73e8; border-color: #c9e0ff; font-weight: 600; }

.chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
.msg-user { display: flex; justify-content: flex-start; }
.msg-ai, .msg-admin { display: flex; justify-content: flex-end; }
.msg-user .bubble { background: #fff; color: #000; border: 1px solid #eaeaea; }
.msg-ai .bubble { background: #f0f0f0; color: #000; }
.msg-admin .bubble { background: #1a73e8; color: #fff; }
.bubble { max-width: 72%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; word-break: break-word; }
.msg-img { max-width: 180px; border-radius: 10px; display: block; }
.chat-input { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-top: 1px solid #eaeaea; align-items: center; }
.chat-input #replyBox { flex: 1; padding: 10px 12px; border: 1px solid #eaeaea; border-radius: 20px; font-size: 14px; outline: none; }
.pic-btn { background: none; border: none; font-size: 20px; padding: 4px 8px; cursor: pointer; }
.send-btn { padding: 8px 18px; background: #000; color: #fff; border: none; border-radius: 20px; font-size: 13px; }
.chat-quick { display: flex; gap: 8px; padding: 8px 14px; background: #fff; border-top: 1px solid #eaeaea; overflow-x: auto; white-space: nowrap; }
.chat-quick::-webkit-scrollbar { display: none; }
.qk-btn { flex-shrink: 0; padding: 7px 12px; background: #f5f5f5; border: none; border-radius: 16px; font-size: 12px; color: #333; cursor: pointer; }
.qk-btn:active { background: #e8e8e8; }
</style>
<style>
.ticket-filter { display: flex; background: #fff; border: 1px solid #eaeaea; border-radius: 10px; padding: 4px; margin-bottom: 12px; }
.ticket-filter .tf { flex: 1; text-align: center; padding: 8px 0; font-size: 13px; color: #666; border-radius: 8px; cursor: pointer; }
.ticket-filter .tf.on { background: #f2f2f2; color: #000; font-weight: 600; }
.pri-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
.pri-tag.urgent { background: #ffeaea; color: #e74c3c; }
.pri-tag.high { background: #fff4e8; color: #d97706; }
.pri-tag.normal { background: #f2f2f2; color: #888; }
</style></head><body>
<div id="app"><div class="topbar" id="topbar"></div><div class="content" id="content">
      <div class="ticket-filter" id="ticketFilter">
        <div class="tf on" data-f="" onclick="setTicketFilter('')">全部</div>
        <div class="tf" data-f="0" onclick="setTicketFilter('0')">待处理</div>
        <div class="tf" data-f="1" onclick="setTicketFilter('1')">处理中</div>
        <div class="tf" data-f="2" onclick="setTicketFilter('2')">已关闭</div>
      </div>
    </div><nav class="tabs-bottom" id="tabs"></nav></div>
<div id="modal"></div><script src="app.js"></script><script>
if (!checkAuth()) throw 0;
renderShell('chat');
let timer = null, activeId = null;


let currentFilter = '';
function setTicketFilter(f) {
  currentFilter = f;
  listChats();
}
function renderFilterBar() {
  return '<div class="ticket-filter" id="ticketFilter">' +
    '<div class="tf ' + (currentFilter===''?'on':'') + '" onclick="setTicketFilter(\'\')">全部</div>' +
    '<div class="tf ' + (currentFilter==='0'?'on':'') + '" onclick="setTicketFilter(\'0\')">待处理</div>' +
    '<div class="tf ' + (currentFilter==='1'?'on':'') + '" onclick="setTicketFilter(\'1\')">处理中</div>' +
    '<div class="tf ' + (currentFilter==='2'?'on':'') + '" onclick="setTicketFilter(\'2\')">已关闭</div>' +
  '</div>';
}

async function listChats() {
  clearInterval(timer);
  const j = await api('/ticket/list');
  if (j.code !== 1) return;
  const h0 = renderFilterBar();
  const src = (currentFilter === '') ? j.data : j.data.filter(t => String(t.status) === currentFilter);
  let h = h0 + '<div class="chat-wrap"><div class="chat-list">';
  if (!src.length) h += '<div class="empty">暂无对话</div>';
  for (const t of src) {
    const tag = t.handoff ? '<div class="ci-tag human">人工</div>' : '<div class="ci-tag ai">AI</div>';
    h += `<div class="chat-item" onclick="openChat(${t.id})">
      <div class="ci-l"><div class="ci-email">${t.email || ('用户'+t.user_id)}</div>
      <div class="ci-preview">${t.handoff ? '人工接管中' : 'AI 自动回复'} · ${fmtTime(t.updated_at)}</div></div>${tag}</div>`;
  }
  h += '</div></div>';
  document.getElementById('content').innerHTML = h;
  timer = setInterval(() => { if (!activeId) listChats(); }, 5000);
}

async function openChat(id) {
  activeId = id;
  clearInterval(timer);
  const j = await api('/ticket/messages?id=' + id);
  const info = await api('/ticket/list');
  const t = info.data.find(x => x.id === id) || {};
  if (j.code !== 1) return;

  let h = `<div class="chat-detail">
    <div class="chat-head">
      <div class="ch-l"><div class="ch-back" onclick="backToList()">←</div>
      <div class="ch-email">${t.email || ('用户'+t.user_id)}</div></div>
      <button class="handoff ${t.handoff?'on':'off'}" onclick="toggleHandoff(${id}, ${t.handoff?0:1})">
        ${t.handoff?'人工接管中':'AI 自动回复'}</button>
    </div>
    <div class="chat-body" id="chatBody">`;
  for (const m of j.data) {
    const who = m.sender === 'user' ? '用户' : (m.sender === 'ai' ? 'AI' : '客服');
    h += `<div class="msg ${m.sender}"><div><div class="who">${who}</div><div class="bubble">${escapeHtml(m.content)}</div></div></div>`;
  }
  h += `</div>
    <div class="chat-input">
      <textarea id="chatInput" placeholder="输入消息…" oninput="this.style.height='42px';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
      <button class="send" onclick="sendReply(${id})">➤</button>
    </div></div>`;
  document.getElementById('content').innerHTML = h;
  scrollBottom();
  timer = setInterval(async () => {
    if (!activeId) return;
    const jj = await api('/ticket/messages?id=' + activeId);
    if (jj.code !== 1) return;
    const body = document.getElementById('chatBody');
    if (!body) return;
    let hh = '';
    for (const m of jj.data) {
      const who = m.sender === 'user' ? '用户' : (m.sender === 'ai' ? 'AI' : '客服');
      hh += `<div class="msg ${m.sender}"><div><div class="who">${who}</div><div class="bubble">${escapeHtml(m.content)}</div></div></div>`;
    }
    body.innerHTML = hh;
    scrollBottom();
  }, 3000);
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scrollBottom(){const b=document.getElementById('chatBody');if(b)b.scrollTop=b.scrollHeight;}
function backToList(){activeId=null;clearInterval(timer);listChats();}

async function sendReply(id) {
  const inp = document.getElementById('chatInput');
  const content = inp.value.trim();
  if (!content) return;
  inp.value = '';
  await api('/ticket/reply', {method:'POST', body: JSON.stringify({id, content})});
  const jj = await api('/ticket/messages?id=' + id);
  if (jj.code === 1) {
    const body = document.getElementById('chatBody');
    let hh = '';
    for (const m of jj.data) {
      const who = m.sender === 'user' ? '用户' : (m.sender === 'ai' ? 'AI' : '客服');
      hh += `<div class="msg ${m.sender}"><div><div class="who">${who}</div><div class="bubble">${escapeHtml(m.content)}</div></div></div>`;
    }
    body.innerHTML = hh;
    scrollBottom();
  }
}

async function toggleHandoff(id, val) {
  await api('/ticket/handoff', {method:'POST', body: JSON.stringify({id, handoff: val})});
  toast(val ? '已接管' : '已交给 AI');
  openChat(id);
}

listChats();
</script></body></html>
