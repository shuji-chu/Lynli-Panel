<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lynli 管理后台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #000; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
.card { width: 100%; max-width: 400px; background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 40px 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.logo { width: 44px; height: 44px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #eaeaea; overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
h1 { font-size: 24px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.5px; color: #000; }
.subtitle { color: #666; font-size: 14px; margin-bottom: 28px; }
label { display: block; color: #666; font-size: 13px; margin-bottom: 6px; font-weight: 500; }
input[type=email], input[type=password], input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid #eaeaea; border-radius: 6px; font-size: 14px; margin-bottom: 18px; outline: none; background: #fff; color: #000; transition: border-color 0.2s; }
input:focus { border-color: #000; }
.captcha-row { display: flex; gap: 12px; margin-bottom: 18px; }
.captcha-row input { margin-bottom: 0; flex: 1; }
.captcha-box { background: #fafafa; border: 1px dashed #ccc; border-radius: 6px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: #000; letter-spacing: 3px; font-family: monospace; user-select: none; cursor: pointer; min-width: 80px; justify-content: center; }
.checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; color: #666; font-size: 13px; }
.checkbox-row input { width: auto; margin: 0; }
button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #000; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
button:active { opacity: 0.8; }
.footer { margin-top: 32px; display: flex; align-items: center; gap: 6px; color: #888; font-size: 12px; justify-content: center; }
.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="logo.png" alt="Lynli"></div>
  <h1>Lynli 管理后台</h1>
  <p class="subtitle">Admin Console</p>
  <label>管理员邮箱</label>
  <input type="email" id="email" autocomplete="username">
  <label>密码</label>
  <input type="password" id="password" autocomplete="current-password">
  <label>验证码</label>
  <div class="captcha-row">
    <input type="text" id="captcha" placeholder="输入右侧4位数字" maxlength="4" inputmode="numeric">
    <div class="captcha-box" id="captchaBox" onclick="refreshCaptcha()">0000</div>
  </div>
  <div class="checkbox-row">
    <input type="checkbox" id="remember">
    <label for="remember" style="margin:0;font-size:13px;color:#666;">记住密码</label>
  </div>
  <button onclick="doLogin()">登 录</button>
  <div class="footer"><span>© 2026 Lynli. All rights reserved.</span></div>
</div>
<div class="toast" id="toast"></div>
<script>
// 账号走后端 /admin/login
let currentCaptcha = "";
function randomCaptcha() { let s = ""; for (let i = 0; i < 4; i++) s += Math.floor(Math.random() * 10); return s; }
function refreshCaptcha() { currentCaptcha = randomCaptcha(); document.getElementById("captchaBox").textContent = currentCaptcha; document.getElementById("captcha").value = ""; }
function showToast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove("show"), 2200); }
function doLogin() {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const captcha = document.getElementById("captcha").value.trim();
  if (!email || !password) return showToast("请输入邮箱和密码");
  if (captcha !== currentCaptcha) { refreshCaptcha(); return showToast("验证码错误或已过期"); }

  fetch("/api/v1/admin/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({email: email, password: password})
  }).then(function(r){ return r.json(); }).then(function(j){
    if (j.code !== 1) {
      refreshCaptcha();
      return showToast(j.msg || "账号或密码错误");
    }
    const d = j.data || {};
    localStorage.setItem("lynli_admin", JSON.stringify({
      email: d.email || email,
      role: d.role || "service",
      loginAt: Date.now()
    }));
    localStorage.setItem("admin_token", d.token || "");
    if (document.getElementById("remember").checked)
      localStorage.setItem("lynli_remember", JSON.stringify({email: email, password: password}));
    else
      localStorage.removeItem("lynli_remember");
    showToast("登录成功");
    setTimeout(function(){ window.location.href = "home.html"; }, 500);
  }).catch(function(e){
    refreshCaptcha();
    showToast("网络错误：" + e.message);
  });
}
refreshCaptcha();
(function () { const saved = localStorage.getItem("lynli_remember"); if (!saved) return; try { const { email, password } = JSON.parse(saved); document.getElementById("email").value = email; document.getElementById("password").value = password; document.getElementById("remember").checked = true; } catch (e) {} })();
document.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
