<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邀请 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.inv-wrap { padding: 14px 14px 90px; }
.inv-tabs { display: flex; background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.inv-tabs .tab { flex: 1; text-align: center; padding: 9px 0; font-size: 14px; color: #666; border-radius: 8px; cursor: pointer; }
.inv-tabs .tab.on { background: #f2f2f2; color: #000; font-weight: 600; }
.inv-tabs .badge { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; padding: 0 5px; font-size: 10px; background: #e74c3c; color: #fff; border-radius: 8px; margin-left: 4px; vertical-align: top; }
.inv-tabs .badge:empty { display: none; }

.iv-card { background: #fff; border: 1px solid #eaeaea; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.iv-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.iv-code { font-size: 18px; font-weight: 700; letter-spacing: 3px; font-family: ui-monospace, Menlo, monospace; color: #000; }
.iv-badge { font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 500; }
.iv-badge.on { background: #e8f8ef; color: #0a9f52; }
.iv-badge.off { background: #f2f2f2; color: #888; }
.iv-email { font-size: 13px; color: #444; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.iv-bind { font-size: 10px; background: #eef4ff; color: #1a73e8; padding: 2px 6px; border-radius: 4px; }
.iv-rate { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px dashed #eee; border-bottom: 1px dashed #eee; margin-bottom: 12px; }
.iv-rate-lab { font-size: 12px; color: #888; }
.iv-rate-val { font-size: 18px; font-weight: 700; color: #1a73e8; }
.iv-rate-btn { margin-left: auto; padding: 6px 14px; border: 1px solid #eaeaea; border-radius: 8px; background: #fff; font-size: 12px; color: #333; }
.iv-rate-up { font-size: 10px; background: #fff4e8; color: #d97706; padding: 2px 6px; border-radius: 4px; }
.iv-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.iv-grid .it { display: flex; flex-direction: column; gap: 3px; }
.iv-grid .k { font-size: 11px; color: #aaa; }
.iv-grid .v { font-size: 15px; font-weight: 600; color: #333; }

.iv-cash { background: #fff; border: 1px solid #eaeaea; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.iv-cash-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.iv-cash-amt { font-size: 22px; font-weight: 700; color: #000; }
.iv-cash-user { font-size: 12px; color: #999; margin-top: 3px; }
.iv-tag { font-size: 11px; padding: 3px 9px; border-radius: 6px; }
.iv-tag.pending { background: #fff4e8; color: #d97706; }
.iv-tag.done { background: #e8f8ef; color: #0a9f52; }
.iv-tag.reject { background: #ffeaea; color: #e74c3c; }
.iv-info .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
.iv-info .row:last-child { border-bottom: none; }
.iv-info .rk { color: #888; }
.iv-info .rv { color: #000; font-weight: 500; }
.iv-actions { display: flex; gap: 10px; margin-top: 14px; }
.iv-actions button { flex: 1; padding: 11px; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; }
.iv-actions .no { background: #f2f2f2; color: #333; }
.iv-actions .yes { background: #000; color: #fff; }
.search-tag { display: inline-flex; align-items: center; gap: 6px; background: #eef4ff; color: #1a73e8; padding: 6px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 14px; }
.search-tag .x { margin-left: 6px; font-size: 14px; cursor: pointer; opacity: .6; }
.search-tag .x:active { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="inv-wrap">
    <div class="inv-tabs">
      <div class="tab on" data-t="codes" onclick="switchTab('codes')">邀请码</div>
      <div class="tab" data-t="cash" onclick="switchTab('cash')">提现申请 <span class="badge" id="cashBadge"></span></div>
    </div>
    <div id="invBody"></div>
  </div>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<div id="modal"></div>
<script src="app.js"></script>
<script src="invites.js"></script>
</body>
</html>
