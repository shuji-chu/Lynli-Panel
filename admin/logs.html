<style>
.lg-wrap { padding: 14px 14px 90px; }
.lg-item { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; }
.lg-icon { width: 36px; height: 36px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.lg-body { flex: 1; min-width: 0; }
.lg-line { font-size: 13px; color: #000; margin-bottom: 4px; }
.lg-line b { color: #1a73e8; }
.lg-target { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #666; word-break: break-all; }
.lg-time { font-size: 11px; color: #aaa; margin-top: 4px; }
</style>
</head>

<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="lg-wrap"><div id="lgList"></div></div>
