<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>节点 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.nt-wrap { padding: 14px 14px 90px; }
.nt-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.nt-sum-card { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 14px 12px; text-align: center; }
.nt-sum-card .k { font-size: 11px; color: #888; margin-bottom: 6px; }
.nt-sum-card .v { font-size: 20px; font-weight: 700; color: #000; }
.nt-sum-card .v.g { color: #0a9f52; }
.nt-sum-card .v.r { color: #e74c3c; }
.nt-card { background: #fff; border: 1px solid #eaeaea; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.nt-card.off { opacity: .55; }
.nt-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.nt-name { font-size: 16px; font-weight: 600; color: #000; display: flex; align-items: center; gap: 8px; }
.nt-flag { font-size: 11px; background: #eef4ff; color: #1a73e8; padding: 2px 7px; border-radius: 5px; font-weight: 500; }
.nt-status { font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
.nt-status.on { background: #e8f8ef; color: #0a9f52; }
.nt-status.off { background: #ffeaea; color: #e74c3c; }
.nt-status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.nt-host { font-size: 12px; color: #999; margin-bottom: 12px; font-family: ui-monospace, Menlo, monospace; }
.nt-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding-top: 12px; border-top: 1px solid #f5f5f5; }
.nt-stats .it { display: flex; flex-direction: column; gap: 3px; }
.nt-stats .k { font-size: 11px; color: #aaa; }
.nt-stats .v { font-size: 14px; font-weight: 600; color: #333; }
.nt-bar { height: 4px; background: #f0f0f0; border-radius: 2px; overflow: hidden; margin-top: 12px; }
.nt-bar .fill { height: 100%; background: linear-gradient(90deg, #0a9f52, #e7a700, #e74c3c); border-radius: 2px; }
.nt-actions { display: flex; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f5f5f5; }
.nt-actions button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; }
.nt-actions .toggle { background: #f2f2f2; color: #333; }
.nt-actions .toggle.off { background: #fff4e8; color: #d97706; }
.nt-actions .copy { background: #f2f2f2; color: #333; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="nt-wrap">
    <div class="nt-summary" id="summary"></div>
    <div id="serverSelector" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"></div>
    <div id="nodeList"></div>
  </div>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<script src="app.js"></script>
<script src="nodes.js"></script>
</body>
</html>
