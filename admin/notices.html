<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公告 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.no-wrap { padding: 14px 14px 90px; }
.no-card { background: #fff; border: 1px solid #eaeaea; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.no-card.off { opacity: .55; }
.no-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.no-type { font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 500; }
.no-type.normal { background: #eef4ff; color: #1a73e8; }
.no-type.activity { background: #fff4e8; color: #d97706; }
.no-type.update { background: #e8f8ef; color: #0a9f52; }
.no-status { font-size: 11px; padding: 3px 9px; border-radius: 6px; margin-left: auto; }
.no-status.on { background: #e8f8ef; color: #0a9f52; }
.no-status.off { background: #f2f2f2; color: #888; }
.no-title { font-size: 15px; font-weight: 600; color: #000; margin-bottom: 6px; }
.no-content { font-size: 13px; color: #666; line-height: 1.55; margin-bottom: 12px; }
.no-time { font-size: 11px; color: #aaa; border-top: 1px solid #f5f5f5; padding-top: 10px; }
.no-actions { display: flex; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f5f5f5; }
.no-actions button { flex: 1; padding: 9px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; }
.no-actions .toggle { background: #f2f2f2; color: #333; }
.no-actions .edit { background: #f2f2f2; color: #333; }
.no-actions .del { background: #fff; color: #e74c3c; border: 1px solid #ffd5d5; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="no-wrap">
    <div id="noList"></div>
  </div>
  <button class="fab" onclick="editNotice(null)">＋</button>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<div id="modal"></div>
<script src="app.js"></script>
<script src="notices.js"></script>
</body>
</html>
