<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支付配置 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.pay-wrap { padding: 14px 14px 90px; }
.pay-card { background: #fff; border: 1px solid #eaeaea; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.pay-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f5f5f5; }
.pay-logo { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; font-weight: 700; }
.pay-logo.alipay { background: linear-gradient(135deg, #1677ff, #4dabf7); }
.pay-logo.usdt   { background: linear-gradient(135deg, #26a17b, #50c596); }
.pay-title { flex: 1; }
.pay-title .n { font-size: 16px; font-weight: 600; color: #000; }
.pay-title .s { font-size: 12px; color: #888; margin-top: 2px; }
.pay-sw { position: relative; width: 46px; height: 26px; background: #ddd; border-radius: 13px; cursor: pointer; flex-shrink: 0; transition: background .2s; }
.pay-sw.on { background: #1a73e8; }
.pay-sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: left .2s; }
.pay-sw.on::after { left: 23px; }
.pay-row { margin-bottom: 12px; }
.pay-row label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
.pay-row input { width: 100%; padding: 10px 12px; border: 1px solid #eaeaea; border-radius: 8px; font-size: 13px; outline: none; font-family: ui-monospace, Menlo, monospace; }
.pay-row input:focus { border-color: #1a73e8; }
.pay-save { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; margin-top: 6px; }
.pay-save:active { opacity: .8; }
.pay-tip { font-size: 12px; color: #888; line-height: 1.6; padding: 10px 12px; background: #f5f8ff; border-radius: 8px; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="pay-wrap"><div id="payList"></div></div>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<script src="app.js"></script>
<script src="payment.js"></script>
</body>
</html>
