<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>兑换码 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.rd-wrap { padding: 14px 14px 90px; }
.rd-stat { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.rd-sc { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 14px 10px; text-align: center; }
.rd-sc .k { font-size: 11px; color: #888; margin-bottom: 6px; }
.rd-sc .v { font-size: 20px; font-weight: 700; color: #000; }
.rd-sc .v.g { color: #0a9f52; }
.rd-sc .v.b { color: #1a73e8; }
.rd-card { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.rd-card.off { opacity: .55; }
.rd-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.rd-code { font-size: 17px; font-weight: 700; letter-spacing: 1px; font-family: ui-monospace, Menlo, monospace; color: #000; }
.rd-status { font-size: 11px; padding: 3px 9px; border-radius: 6px; }
.rd-status.on { background: #e8f8ef; color: #0a9f52; }
.rd-status.off { background: #f2f2f2; color: #888; }
.rd-status.used { background: #ffeaea; color: #e74c3c; }
.rd-info { font-size: 12px; color: #666; line-height: 1.7; }
.rd-info b { color: #000; font-weight: 600; }
.rd-acts { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f5f5f5; }
.rd-acts button { flex: 1; padding: 8px; border: none; border-radius: 8px; font-size: 12px; font-weight: 500; }
.rd-acts .cp { background: #eef4ff; color: #1a73e8; }
.rd-acts .tg { background: #f2f2f2; color: #333; }
.rd-acts .del { background: #fff; color: #e74c3c; border: 1px solid #ffd5d5; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="rd-wrap">
    <div class="rd-stat" id="statBox"></div>
    <div id="codeList"></div>
  </div>
  <button class="fab" onclick="showGen()">＋</button>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<div id="modal"></div>
<script src="app.js"></script>
<script src="redeem.js"></script>
</body>
</html>
