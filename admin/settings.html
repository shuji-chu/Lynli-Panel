<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统设置 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.set-group{background:#fff;border:1px solid #eaeaea;border-radius:14px;padding:16px;margin-bottom:14px}
.set-group h3{font-size:14px;color:#0F1A3C;margin:0 0 14px;font-weight:600}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5;gap:12px}
.set-row:last-child{border-bottom:none}
.set-row .k{font-size:13px;color:#333;flex-shrink:0;max-width:110px}
.set-row .k .sub{font-size:11px;color:#94A3B8;margin-top:2px;font-weight:400}
.set-row input[type=text],.set-row input[type=number],.set-row textarea{flex:1;padding:9px 12px;border:1px solid #eaeaea;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#F9FBFF;text-align:right}
.set-row input:focus,.set-row textarea:focus{border-color:#2E5BFF;background:#fff}
.set-row textarea{min-height:60px;text-align:left;resize:vertical}
.set-row .switch{position:relative;width:44px;height:26px;background:#ddd;border-radius:13px;transition:.22s;cursor:pointer;flex-shrink:0}
.set-row .switch.on{background:#2E5BFF}
.set-row .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:10px;transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.set-row .switch.on::after{left:21px}
.save-bar{position:sticky;bottom:0;padding:14px 0;background:linear-gradient(transparent,#EEF4FF 30%);margin-top:8px}
.save-bar button{width:100%;padding:14px;background:#2E5BFF;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.save-bar button:active{opacity:.85}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="dash" style="padding-bottom:20px">
    <div id="form"></div>
    <div class="save-bar"><button onclick="save()">保存全部设置</button></div>
  </div>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<script src="app.js"></script>
<script src="settings.js"></script>
</body>
</html>
