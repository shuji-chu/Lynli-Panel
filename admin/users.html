<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户 · Lynli</title>
<link rel="stylesheet" href="style.css">
<style>
.u-detail { margin-bottom: 16px; background: #fafafa; border-radius: 10px; padding: 12px 14px; }
.ud-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 13px; }
.ud-k { color: #888; }
.ud-v { color: #000; font-weight: 500; }
.op-sec { margin-bottom: 18px; }
.op-sec-title { font-size: 12px; font-weight: 600; color: #888; margin-bottom: 8px; }
.op-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.op-btn { flex: 1; min-width: 78px; padding: 11px 6px; border: 1px solid #eaeaea; border-radius: 10px; background: #fff; font-size: 13px; color: #333; font-weight: 500; }
.op-btn:active { background: #f5f5f5; }
.op-btn.danger { color: #e74c3c; border-color: #ffd5d5; }
.op-btn.warn { color: #d97706; border-color: #ffe0b3; }
.op-btn.primary { background: #000; color: #fff; border-color: #000; }
.u-filter { display: flex; background: #fff; border: 1px solid #eaeaea; border-radius: 10px; padding: 4px; margin-bottom: 12px; }
.u-filter .uf { flex: 1; text-align: center; padding: 8px 0; font-size: 13px; color: #666; border-radius: 8px; cursor: pointer; }
.u-filter .uf.on { background: #f2f2f2; color: #000; font-weight: 600; }
.u-filter .uf .c { font-size: 11px; color: #aaa; margin-left: 2px; }
.u-sort { display: flex; gap: 8px; margin-bottom: 12px; }
.u-sort select { flex: 1; padding: 9px 12px; border: 1px solid #eaeaea; border-radius: 10px; font-size: 13px; background: #fff; color: #333; }
.search-tag { display: inline-flex; align-items: center; gap: 6px; background: #eef4ff; color: #1a73e8; padding: 6px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 14px; }
.search-tag .x { margin-left: 6px; font-size: 14px; cursor: pointer; opacity: .6; }
.sheet select, .sheet input { font-family: inherit; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:13px;color:#666">用户列表</div>
      <div style="font-size:12px;color:#1a73e8;cursor:pointer" onclick="exportCSV()">导出 CSV</div>
    </div>
    <div class="u-filter">
      <div class="uf on" data-f="all" onclick="setFilter('all')">全部 <span class="c">0</span></div>
      <div class="uf" data-f="active" onclick="setFilter('active')">正常 <span class="c">0</span></div>
      <div class="uf" data-f="expired" onclick="setFilter('expired')">已过期 <span class="c">0</span></div>
      <div class="uf" data-f="banned" onclick="setFilter('banned')">封禁 <span class="c">0</span></div>
    </div>
    <div class="u-sort">
      <select id="uSort" onchange="setSort(this.value)">
        <option value="reg_desc">最新注册</option>
        <option value="expire_asc">即将到期</option>
        <option value="used_desc">用量最多</option>
      </select>
    </div>
    <div id="batchBar" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #eaeaea;border-radius:12px;padding:10px 12px;margin-bottom:10px">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#666">
        <input type="checkbox" id="selAll" onchange="toggleAll(this.checked)" style="width:16px;height:16px;accent-color:#2E5BFF"> 全选
      </label>
      <span id="selCount" style="font-size:12px;color:#2E5BFF;font-weight:600"></span>
      <div style="flex:1;min-width:8px"></div>
      <button class="op-btn" style="padding:7px 11px;font-size:12px;border:1px solid #eaeaea;border-radius:8px;background:#fff;font-family:inherit" onclick="doBatch('add_days',30)">+30天</button>
      <button class="op-btn" style="padding:7px 11px;font-size:12px;border:1px solid #eaeaea;border-radius:8px;background:#fff;font-family:inherit" onclick="doBatch('reset_traffic')">重置流量</button>
      <button class="op-btn" style="padding:7px 11px;font-size:12px;border:1px solid #d5e0ff;border-radius:8px;background:#eef4ff;color:#2E5BFF;font-family:inherit" onclick="doBatchTag()">打标签</button>
      <button class="op-btn warn" style="padding:7px 11px;font-size:12px;border:1px solid #ffe0b3;border-radius:8px;background:#fff;color:#d97706;font-family:inherit" onclick="doBatch('ban')">封禁</button>
      <button class="op-btn" style="padding:7px 11px;font-size:12px;border:1px solid #eaeaea;border-radius:8px;background:#fff;font-family:inherit" onclick="doBatch('unban')">解封</button>
      <button class="op-btn danger" style="padding:7px 11px;font-size:12px;border:1px solid #ffd5d5;border-radius:8px;background:#fff5f5;color:#e74c3c;font-family:inherit" onclick="doBatch('delete')">删除</button>
    </div>
    <div id="userList"></div>
  </div>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<div id="modal"></div>
<script src="app.js"></script>
<script src="users.js"></script>
</body>
</html>
